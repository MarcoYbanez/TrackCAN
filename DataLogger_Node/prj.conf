CONFIG_GPIO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_MCUX_TRNG=y

CONFIG_SPI=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_CAN=y
CONFIG_LOG=y

# TCAN-18: USB serial port; a 134 baud request reboots into the programming bootloader
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="TrackCAN DataLogger"
CONFIG_UART_LINE_CTRL=y
# TCAN-18: the defaults overflowed (MPU fault 10 ms after USB init); Teensy has plenty of RAM
CONFIG_UDC_WORKQUEUE_STACK_SIZE=2048
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
