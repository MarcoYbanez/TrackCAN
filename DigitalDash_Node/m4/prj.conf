# Hardware-semaphore mailbox: the M4 tells the M7 a new snapshot is ready.
CONFIG_IPM=y

# The M4's own independent watchdog (IWDG2, see app.overlay): resets the chip if the publish loop stalls.
CONFIG_WATCHDOG=y

# TrackCAN on the M4's FDCAN controller (classic CAN, see app.overlay).
CONFIG_CAN=y
CONFIG_MAIN_STACK_SIZE=4096
