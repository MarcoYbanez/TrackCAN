# Display: the board's 4.3" 480x272 RGB panel through the LTDC, frame buffer in SDRAM
# (set in the board devicetree).
CONFIG_DISPLAY=y
# The panel's on/off and backlight pins are GPIOs: without this the LTDC driver fails to start (white screen).
CONFIG_GPIO=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_MAIN_STACK_SIZE=8192

# The M7 data cache must be invalidated before reading what the M4 wrote.
CONFIG_CACHE_MANAGEMENT=y

# Hardware-semaphore mailbox: the M4 tells the M7 a new snapshot is ready.
CONFIG_IPM=y

CONFIG_LOG=y

# The M7's own independent watchdog (IWDG1): resets the chip if the render loop stalls, so a frozen picture never
# stays on screen. HWINFO tells the log why the chip last reset.
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
